<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loteria Federal - Finalizar Aposta</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Finalizar Aposta</h2>
        <form id="form-aposta">
            <div class="form-group">
                <label for="nome">Seu Nome:</label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>
            
            <div class="form-group">
                <label for="email">Seu E-mail:</label>
                <input type="email" id="email" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="form-group">
                <label for="whatsapp">Seu WhatsApp:</label>
                <input type="text" id="whatsapp" required placeholder="(XX) 9XXXX-XXXX">
            </div>

            <button type="submit" id="btn-finalizar">Finalizar e Enviar</button>
        </form>
    </div>

    <script>
        document.getElementById('form-aposta').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nomeCliente = document.getElementById('nome').value.trim();
            const emailCliente = document.getElementById('email').value.trim();
            const whatsappCliente = document.getElementById('whatsapp').value.replace(/\D/g, ''); 
            const apostasSelecionadas = window.apostas || [{ bilhete: "Exemplo de Bilhete 001", valor: "R$ 10,00" }]; // Ajuste conforme os seus dados de jogos salvos

            const botao = document.getElementById('btn-finalizar');
            botao.disabled = true;
            botao.innerText = 'Processando...';

            const payload = {
                nome: nomeCliente,
                email: emailCliente,
                whatsapp: whatsappCliente,
                apostas: apostasSelecionadas
            };

            try {
                // Envia para a API no servidor automaticamente
                const response = await fetch('/api/enviar-comprovante', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resultado = await response.json();

                if (!response.ok) {
                    throw new Error(resultado.erro || 'Erro ao enviar e-mail.');
                }

                // Prepara o link do WhatsApp para abrir no celular/computador do cliente
                const textoResumo = `Olá, *${nomeCliente}*! Suas apostas da Loteria Federal foram registradas com sucesso.\n\n*Detalhes:* ${JSON.stringify(apostasSelecionadas)}\n\nUma cópia também foi enviada para o seu e-mail: ${emailCliente}`;
                const urlWhatsApp = `https://wa.me/55${whatsappCliente}?text=${encodeURIComponent(textoResumo)}`;

                alert('Aposta finalizada! O comprovante foi enviado para o seu e-mail e para o administrador.');
                window.open(urlWhatsApp, '_blank');

            } catch (erro) {
                console.error('Erro:', erro);
                alert('Houve um erro ao processar o envio automático. Tente novamente.');
            } finally {
                botao.disabled = false;
                botao.innerText = 'Finalizar e Enviar';
            }
        });
    </script>
</body>
</html>
